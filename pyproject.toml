[project]
name = "sqlqa"
version = "0.1.0"
description = "LangGraph question-answering agent over a SQL database"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=30.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlqa", "university"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
