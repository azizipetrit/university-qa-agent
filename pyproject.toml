[project]
name = "sqlqa"
version = "0.1.0"
description = "LangGraph question-answering agent over a SQL database"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
    "sqlglot>=30.31.0",
]

[project.scripts]
sqlqa = "sqlqa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlqa", "university"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call a real model and cost money. Run them with: uv run pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls the real model configured in .env (not run by default)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
